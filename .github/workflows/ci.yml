name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PG_URL: postgresql://postgres:postgres@localhost:5432/ragdb
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  QDRANT_URL: http://localhost:6333
  # CI 无外部向量/重排服务：用确定性 hash 向量 + 跳过重排
  EMBEDDING_PROVIDER: hash
  RERANK_PROVIDER: none
  SECURITY_STRICT: "0"

jobs:
  lint:
    name: 代码规范 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: ruff 检查
        run: ruff check src tests

  backend-tests:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ragdb"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 30
      qdrant:
        image: qdrant/qdrant:v1.13.0
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: 安装依赖
        run: pip install -e .
      - name: 等待 qdrant 就绪
        run: |
          for i in $(seq 1 60); do
            if bash -c 'exec 3<>/dev/tcp/localhost/6333' 2>/dev/null; then
              echo "qdrant ready"; break
            fi
            sleep 2
          done
      - name: 跑后端测试（e2e 除外；LLM 相关用例需配置 Secrets）
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          MINERU_API_KEY: ${{ secrets.MINERU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: pytest -q --ignore=tests/e2e --maxfail=5 -p no:cacheprovider
      - name: 意图识别与导购状态机评测
        run: python scripts/eval_intent_stage.py

  frontend-build:
    name: 前端构建 (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: 构建产物
        run: npm run build

  deploy-image:
    name: 构建并推送镜像 (CD)
    needs: [lint, backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算小写镜像仓库名（GHCR 要求小写）
        run: echo "IMG_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: 构建并推送后端镜像（含前端 dist）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMG_REPO }}/agent-base-backend:latest
            ${{ env.IMG_REPO }}/agent-base-backend:${{ github.sha }}
  deploy:
    name: 部署到线上 (SSH + GHCR)
    needs: deploy-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH 拉取新镜像并重启（健康检查失败自动回滚上一镜像）
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/agent-base
            IMG="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/agent-base-backend"
            OLD_ID=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q backend)" 2>/dev/null || true)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend
            docker compose up -d --no-build backend
            # 健康检查（最多等 150s）
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
                echo "deploy ok (attempt $i)"
                exit 0
              fi
              sleep 5
            done
            # 回滚：把上一镜像 ID 打回 latest 并重启
            if [ -n "$OLD_ID" ]; then
              docker tag "$OLD_ID" "$IMG:latest"
              docker compose up -d --no-build backend
              echo "health check failed, rolled back to previous image"
            else
              echo "health check failed, no previous image to roll back to"
            fi
            exit 1
