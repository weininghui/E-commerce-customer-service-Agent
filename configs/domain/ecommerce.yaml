domain: ecommerce
intents:
  product_query:
    keywords: [成分, 参数, 适合, 肤质, 功效, 精华, 面霜, 防晒, 洁面, 眼霜, 面膜, 质地, 配方, 保湿, 控油, 美白, 抗老, 紧致, 修复, 舒缓, 温和, 刺激, 不含, 含酒精, 孕妇, 适用肤质, 能用吗, 注意, 事项, 禁忌, 副作用, 慎用, 用法, 用量, 买错, 想买, 下单, 纠结, 犹豫, 怕买, 好用吗, 再想想, 考虑考虑, 先看看, 再看看, 拿不定主意]
    sections: [商品参数, 卖点]
    examples:
      - "这款玻尿酸精华适合油皮吗"
      - "胜肽紧致眼霜适合什么年龄段"
      - "氨基酸洁面乳含酒精吗"
      - "烟酰胺控油精华有什么功效"
      - "物理防晒霜SPF值是多少"
      - "这款面霜的成分表有防腐剂吗"
      - "敏感肌能用含水杨酸的产品吗"
      - "玻尿酸原液和水乳哪个先用"
      - "这款精华孕妇可以用吗"
  fashion_query:
    keywords: [搭配, 穿搭, 尺码, 面料, 版型, 季节, 通勤, 休闲, 法式, 显瘦, 会透吗, 基础款, 缩水, 透气, 垂感, 起球, 掉色, 怎么穿, 怎么洗, 洗涤, 清洗, 机洗, 水洗, 护理, 衣服, 裙子, 裤子, 衬衫, T恤, 连衣裙, 阔腿裤]
    sections: [商品参数, 卖点, 搭配建议, 使用要点, 服饰洗涤护理常见问题]
    examples:
      - "白色T恤怎么搭配通勤"
      - "法式碎花连衣裙适合什么身材"
      - "醋酸衬衫适合通勤吗"
      - "高腰阔腿裤怎么搭配"
      - "冰丝阔腿裤夏天穿热吗"
      - "这件针织开衫会缩水吗"
      - "缎面吊带裙适合什么场合穿"
      - "白色衬衫会不会透"
      - "这条牛仔裤显瘦吗"
  price_query:
    keywords: [多少钱, 价格, 优惠, 折扣, 到手价, 原价, 划算, 便宜, 贵吗, 性价比, 太贵, 贵了, 有点贵, 嫌贵, 能便宜]
    sections: [价格]
    examples:
      - "这款精华多少钱"
      - "有优惠吗"
      - "现在有什么折扣活动"
      - "两件一起买能便宜点吗"
      - "这个价位划不划算"
      - "双十一大概什么价格"
  aftersale:
    keywords: [退货, 退款, 换货, 过敏, 发票, 发货, 物流, 保质期, 退换, 七天无理由, 快递, 到货, 签收, 运费, 售后, 投诉, 客服, 转人工, 差评, 骗子, 垃圾, 态度, 能退吗, 退吗, 能换吗]
    sections: [售后FAQ]
    examples:
      - "支持七天无理由退货吗"
      - "退款多久到账"
      - "拆封了还能退货吗"
      - "换货运费谁承担"
      - "我什么时候能收到货"
      - "订单显示已发货但查不到物流"
      - "用了过敏可以退吗"
      - "发票什么时候开"
      - "保质期还有多久"
  recommendation:
    keywords: [推荐, 适合我, 油皮, 干皮, 敏感肌, 痘痘肌, 混合皮, 中性皮, 肤色, 暗沉, 送人, 礼物, 种草, 想入手, 帮我看看, 来一瓶, 买什么, 配什么, 搭配什么, 还缺, 送女朋友, 送男朋友, 送家人, 送朋友, 送妈妈, 送爸爸]
    sections: [商品参数, 卖点, 评价]
    examples:
      - "敏感肌泛红用什么面霜"
      - "有什么适合油皮的精华推荐吗"
      - "送女朋友什么护肤品好"
      - "干皮秋冬用什么面霜"
      - "预算三百以内推荐什么精华"
      - "通勤穿搭帮我搭配一套"
      - "有痘印适合什么护肤品"
  comparison:
    keywords: [哪个好, 和.比, 对比, 区别, 差别, 选哪个, 有什么不同, 比较, 不如, 更好, 相比, 差异, 比别家, 好多了, 强多了, 怎么选, 哪个更好, 怎么挑]
    sections: [商品参数, 卖点, 评价]
    examples:
      - "氨基酸洁面和皂基洁面有什么区别"
      - "这款和那个哪个好"
      - "物理防晒和化学防晒的区别"
      - "玻尿酸精华和烟酰胺精华怎么选"
      - "这件和另一件版型哪个更显瘦"
  size_recommendation:
    keywords: [尺码, 怎么选尺码, 穿什么码, 身高, 体重, 合身, 偏大, 偏小, 选几码, 什么号, 腰围, 胸围, 肩宽, 衣长, 裤长]
    sections: [商品参数, 卖点, 搭配建议]
    examples:
      - "我165怎么选尺码"
      - "这件T恤偏大吗"
      - "身高160体重50穿什么码"
      - "我肩宽42选什么码合适"
      - "这条裤子腰围76穿M还是L"
  promotion:
    keywords: [活动, 满减, 优惠券, 赠品, 折扣, 秒杀, 限时, 促销, 双十一, "618", 新人, 首单, 会员, 积分, 抵扣, 包邮]
    sections: [价格, 售后FAQ]
    examples:
      - "现在有什么满减活动吗"
      - "双十一有优惠吗"
      - "新人首单有什么折扣"
      - "会员日有什么活动"
      - "满300减50能叠加优惠券吗"
      - "直播间下单有赠品吗"
retrieval:
  index_collection: ecommerce_chunks
  summary_collection: ecommerce_summaries
  filter_fields: [category, brand, price_band, skin_types, style, season]
prompt:
  system: 你是美妆服饰电商客服助手，只依据商品资料和 FAQ 回答，不做功效承诺，涉及皮肤问题建议咨询专业人士。
compliance:
  banned_words: [最, 第一, 100%, 根治, 永不复发, 特效]
intent_anchors:
  product_query: [商品参数, 功效, 成分, 适合肤质, 规格, 使用]
  fashion_query: [穿搭, 搭配, 版型, 季节, 尺码, 面料, 风格, 场合]
  price_query: [价格, 优惠, 折扣, 到手价]
  aftersale: [退换货, 物流, 发票, 售后, 保质期]
  recommendation: [推荐, 适合肤质, 使用场景, 评价]
  general_qa: []
