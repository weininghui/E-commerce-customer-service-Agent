# P19 打标标准（真相源）：doc_type 定义 + 信号词 + 示例。
# 原则：标准可配置不改代码；管理端可改（写 PG 版本化），YAML 为默认真相源。
# 预审 LLM 配置在 configs/app.yaml pre_review_llm 段；评审/摘要 prompt 在
# configs/prompts_ecommerce.yaml（pre_review / summary 段）。
#
# doc_type 分组（18 种，覆盖全电商知识库入库场景）：
#   商品类：product_detail / product_longdoc / metadata_doc
#   指南类：guide（合并原 category_guide / guide / fashion_guide）
#   售后客服类：faq / agent_script / aftersale_flow
#   规则政策类：policy / logistics / membership
#   溯源科普类：origin_cert / ingredient / material
#   对比品牌类：comparison / brand_intro
#   垂直类目类：nutrition_facts / tech_spec / install_guide

doc_types:
  # ═══════════════════════════════════════════════════════
  # 商品类（3）
  # ═══════════════════════════════════════════════════════
  product_detail:
    description: 商品详情页/商品卡片：品牌、名称、类目、功效、成分、面料、版型、尺码、卖点、用户评价
    strategy: [parent_child, summary_index]
    signals: [商品, 品牌, 功效, 成分, 面料, 版型, 尺码, 卖点, 适合肤质, 风格, 价位]
    examples:
      - "【花颜集】玻尿酸保湿精华液\n类目: 精华 | 价位: 中端\n适合肤质: 油皮,干皮\n功效: 保湿,补水\n核心成分: 玻尿酸"
      - "白色纯棉T恤\n类目: T恤 | 价位: 入门\n面料: 纯棉\n尺码: S-XL\n风格: 基础百搭"
      - "高腰直筒牛仔裤\n类目: 牛仔裤 | 价位: 中端\n面料: 弹力牛仔布\n版型: 高腰直筒\n尺码: 26-32\n风格: 复古显腿长"
  product_longdoc:
    description: 商品长文/种草文：产品卖点、使用方法、用户反馈、测评体验
    strategy: [summary_index, parent_child]
    signals: [使用方法, 用户反馈, 种草, 卖点, 使用感受, 测评, 体验报告, 开箱]
    examples:
      - "花颜集玻尿酸保湿精华液，采用双重分子量玻尿酸，大分子表层锁水、小分子深层渗透"
      - "使用方法：洁面后取2-3滴于掌心，均匀涂抹于面部，轻拍至吸收。后续叠加乳液锁水。早晚各一次，持续使用2周可见明显改善。"
      - "用户反馈：油皮使用一周后不闷痘，保湿持久度从4小时提升到8小时；干皮用户反馈冬季起皮明显改善，后续上妆更服帖。"
  metadata_doc:
    description: 参数/规格文档：成分表、尺码表、参数表、防晒参数
    strategy: [self_query]
    signals: [成分表, 参数, 规格, 尺码表, SPF, UPF, 浓度, 含量]
    examples:
      - "成分表：水、玻尿酸、烟酰胺；浓度5%"
      - "尺码表：S 胸围88 腰围68 / M 胸围92 腰围72"
      - "防晒参数：SPF50+ PA++++，防护时长8小时，防水40分钟"

  # ═══════════════════════════════════════════════════════
  # 指南类（1，合并原 category_guide / guide / fashion_guide）
  # ═══════════════════════════════════════════════════════
  guide:
    description: 指南/攻略/穿搭/选购文档：尺码指南、穿搭建议、护肤流程、色彩搭配、场景穿搭、选购攻略
    strategy: [summary_index]
    signals: [搭配, 穿搭, 指南, 攻略, 推荐, 怎么穿, 怎么选, 流程, 步骤, 尺码, 测量, 版型, 建议, 色彩, 通勤, 叠穿, 场景]
    examples:
      - "通勤穿搭指南：白衬衫+直筒裤，适合办公室场景；外搭针织开衫应对空调房温差"
      - "油皮护肤流程：洁面→爽肤水→精华→乳液→防晒，避免使用厚重面霜，选择清爽质地产品"
      - "色彩搭配原则：全身上下不超过3个主色，同色系显高显瘦；黄皮避免荧光色与冷调紫"
      - "S 码适合胸围 78-84cm，M 码 84-90cm，L 码 90-96cm"
      - "敏感肌选购攻略：避开酒精、香精、酸类，优先选择含神经酰胺的修护型产品"

  # ═══════════════════════════════════════════════════════
  # 售后/客服类（3）
  # ═══════════════════════════════════════════════════════
  faq:
    description: 纯问答格式文档：Q/A 对、常见问题咨询（不含售后政策条款，条款归 aftersale_flow）
    strategy: [hypothetical_variants]
    signals: ["Q:", "A:", 问题, 回答, FAQ, 常见问题, 咨询, 能用吗, 适合吗, 怎么用]
    examples:
      - "Q: 敏感肌能用吗？\nA: 本品无酒精无香精，适合敏感肌，建议首次在耳后做局部测试"
      - "Q: 孕妇可以用吗？\nA: 本品不含维A酸、水杨酸等孕妇慎用成分，但建议咨询医生后使用"
      - "Q: 可以和其他精华叠加吗？\nA: 可以，建议先涂质地轻薄的，待吸收后再涂厚重的"
  agent_script:
    description: 客服话术/SOP：售前咨询、售后安抚、投诉处理的标准答复与场景话术模板
    strategy: [summary_index]
    signals: [话术模板, SOP, 标准答复, 安抚话术, 升级话术, 转接话术, 培训话术, 场景话术, 客服用语, 应答模板]
    examples:
      - "【售后安抚话术】客户反馈物流慢时：非常抱歉让您久等了，我立刻帮您查询物流进度，最迟今天给您回复，请您放心。"
      - "【售前咨询话术】客户问敏感肌是否适用：您好，这款产品无酒精无香精，适合敏感肌使用，建议首次在耳后做局部测试。"
      - "【投诉处理话术】客户要求赔偿时：理解您的心情，我已记录您的问题并升级至主管，2小时内给您回复处理方案，感谢您的耐心。"
  aftersale_flow:
    description: 售后处理流程：退换货SOP、投诉升级路径、赔付标准、工单流转规则、售后政策条款
    strategy: [default_vector]
    signals: [处理流程, 工单, 升级, 转交, 赔付, 客服操作, 流转, SLA, 处理时限, 责任划分, 退货政策, 退款规则, 七天无理由]
    examples:
      - "【退货处理SOP】签收7天内未拆封：直接走七天无理由流程；已拆封但质量问题：提交质检工单，48小时内出具结论，质量问题全额退款。"
      - "【投诉升级路径】一级客服处理→未解决升级至主管（2小时内）→仍未解决升级至客服经理（24小时内），全程记录工单。"
      - "【赔付标准】质量问题全额退款+运费补贴；非质量问题退货扣运费；延迟发货赔付订单金额10%（上限100元）。"

  # ═══════════════════════════════════════════════════════
  # 规则/政策类（3）
  # ═══════════════════════════════════════════════════════
  policy:
    description: 政策/合规文档：广告法、功效宣称规范、客服话术红线、平台合规要求
    strategy: [default_vector]
    signals: [广告法, 合规, 宣称, 绝对化用语, 医疗用语, 话术, 红线, 禁用词, 平台规则]
    examples:
      - "化妆品宣传禁止使用治疗、治愈、药妆等医疗用语"
      - "广告法禁用绝对化用语：最佳、第一、顶级、国家级、绝无仅有，违规罚款20-100万"
      - "客服话术红线：不可承诺「永久有效」「适合所有人」「零过敏」，不可引导用户停用医生处方"
  logistics:
    description: 物流/运费规则：发货时效、运费标准、偏远地区、跨境物流、配送范围
    strategy: [default_vector]
    signals: [发货时效, 运费, 偏远地区, 跨境, 配送范围, 快递, 物流规则, 包邮, 满减包邮]
    examples:
      - "发货时效：付款后48小时内发货，预售商品按页面标注时效发货；大促期间可能延迟至72小时"
      - "运费规则：满99元包邮，不满99元收运费10元；偏远地区（新疆/西藏/青海）加收15元"
      - "跨境物流：海外订单走保税仓发货，7-15个工作日送达；直邮订单15-30个工作日，关税由买家承担"
  membership:
    description: 会员/积分规则：会员等级、权益、积分获取与兑换、VIP活动
    strategy: [default_vector]
    signals: [会员, 积分, 等级, 权益, VIP, 会员日, 兑换, 成长值, 生日权益, 专属折扣]
    examples:
      - "会员等级：V1普通会员（注册即享）/ V2银卡（年消费满500）/ V3金卡（满2000）/ V4钻石（满5000），各等级享不同折扣"
      - "积分规则：消费1元=1积分，签到5积分，评价10积分；100积分=1元，下单时可抵扣"
      - "会员日：每月18号金卡及以上会员享全场额外88折，积分双倍，限时商品提前购"

  # ═══════════════════════════════════════════════════════
  # 溯源/科普类（3）
  # ═══════════════════════════════════════════════════════
  origin_cert:
    description: 产地/溯源文档：原料产地、生产资质、质检流程、检测报告
    strategy: [default_vector]
    signals: [产地, 溯源, 原料来源, 生产车间, 资质, 检测报告, 批次, ISO, COA, 质检]
    examples:
      - "花颜集原料与生产基地位于华东地区，生产车间通过 ISO 22716 认证"
      - "批次 QC2026080401 检测报告：菌落总数 < 10 CFU/g，重金属未检出，符合《化妆品安全技术规范》要求"
      - "玻尿酸原料采购自华熙生物，产地山东济南，提供原料 COA 检测报告与溯源编码"
  ingredient:
    description: 成分科普文档：成分作用、浓度、耐受、搭配禁忌（美妆/护肤类目）
    strategy: [default_vector]
    signals: [成分, 作用, 浓度, 耐受, 禁忌, 搭配, 烟酰胺, 玻尿酸, 视黄醇, 水杨酸]
    examples:
      - "烟酰胺（维生素 B3）有助于提亮肤色、改善暗沉，同时具有控油和修护屏障的作用"
      - "玻尿酸（透明质酸）具有强效保湿作用，可吸收自身重量1000倍的水分，2%浓度即可起效，适合所有肤质"
      - "成分搭配禁忌：烟酰胺避免与高浓度VC同时使用（pH冲突降低功效）；水杨酸避免与A醇叠加（过度刺激）"
  material:
    description: 面料/材质文档：面料特性、支数、洗涤保养、选购建议（服装/家纺类目）
    strategy: [default_vector]
    signals: [面料, 材质, 支数, 棉, 洗涤, 保养, 起球, 缩水, 混纺, 支数]
    examples:
      - "纯棉面料吸湿透气、亲肤柔软，适合贴身穿着，但易皱、缩水率约 3-5%"
      - "涤纶（聚酯纤维）耐磨抗皱、快干保形，但透气性差、易起静电，常与棉混纺平衡舒适与耐用"
      - "莫代尔面料来自榉木浆，柔软度优于棉、吸湿快干，但多次水洗后易变形，建议冷水手洗"

  # ═══════════════════════════════════════════════════════
  # 对比/品牌类（2）
  # ═══════════════════════════════════════════════════════
  comparison:
    description: 商品对比文档：同类商品对比、竞品对比、新老款对比、升级版对比
    strategy: [summary_index]
    signals: [对比, VS, 区别, 哪个好, 新款, 老款, 升级版, 对比表, 差异, 横评]
    examples:
      - "花颜集玻尿酸精华 vs 烟酰胺精华：前者主打保湿适合干皮，后者主打提亮适合暗沉肌，可叠加使用"
      - "新款 vs 老款区别：新版增加了角鲨烷成分，保湿力提升30%，包装改为真空泵头防氧化，价格不变"
      - "纯棉T恤 vs 混纺T恤：纯棉更透气亲肤但易皱，混弹抗皱保形但透气性差，通勤选混纺运动选纯棉"
  brand_intro:
    description: 品牌介绍文档：品牌故事、品牌理念、品牌历史、创始人、品牌定位
    strategy: [default_vector]
    signals: [品牌故事, 品牌理念, 品牌历史, 创始人, 品牌定位, 品牌文化, 品牌使命, about]
    examples:
      - "花颜集创立于2018年，专注于基础保湿与修护，理念是「少即是多」，拒绝堆砌成分，只做有效且温和的产品"
      - "品牌创始人小颜曾是资深配方师，因自身敏感肌困扰，致力于研发无刺激的修护型护肤品"
      - "花颜集定位中端性价比，目标用户为18-35岁追求成分安全与功效平衡的年轻女性"

  # ═══════════════════════════════════════════════════════
  # 垂直类目专属（3）
  # ═══════════════════════════════════════════════════════
  nutrition_facts:
    description: 食品营养文档：营养成分表、配料表、保质期、存储条件、食品认证
    strategy: [self_query]
    signals: [营养成分表, 配料表, 保质期, 存储条件, 热量, 蛋白质, 脂肪, 碳水, 钠, 食品认证, SC认证]
    examples:
      - "营养成分表（每100g）：能量 350kJ，蛋白质 6.2g，脂肪 1.5g，碳水化合物 12.8g，钠 280mg"
      - "配料表：水、白砂糖、浓缩果汁、果胶、柠檬酸、维生素C；不含防腐剂、人工色素"
      - "保质期：12个月，存储条件：阴凉干燥处，避免阳光直射；开封后冷藏并于7天内饮用完"
  tech_spec:
    description: 3C/数码技术参数文档：技术规格、认证证书、接口参数、性能指标
    strategy: [self_query]
    signals: [技术参数, 认证, 3C认证, 接口, 功率, 电压, 频率, 蓝牙版本, 电池容量, 分辨率, 处理器]
    examples:
      - "技术参数：屏幕 6.1英寸 OLED，分辨率 2532×1170，处理器 A15，电池 3240mAh，支持 5G"
      - "认证信息：3C认证编号 2024010901000123，CE认证，FCC认证，RoHS环保认证"
      - "接口参数：USB-C 3.2，支持 PD 快充 30W，蓝牙 5.3，WiFi 6，NFC，不支持 3.5mm 耳机"
  install_guide:
    description: 安装/使用说明文档：家居安装、母婴使用说明、组装步骤、安全注意事项
    strategy: [summary_index]
    signals: [安装说明, 组装, 步骤, 使用说明, 安全注意事项, 工具, 拆装, 年龄段, 承重, 警告]
    examples:
      - "书架安装说明：1.将侧板平放 2.插入层板卡扣 3.拧紧螺丝 4.固定背板 5.墙面防倒固定（重要！）"
      - "婴儿推车使用说明：适用年龄段 0-36个月，最大承重 15kg，使用前检查安全带是否扣紧，禁止在楼梯附近使用"
      - "收纳柜组装步骤：所需工具十字螺丝刀，预计组装时间 30分钟，按编号依次拼接板件，注意箭头方向"
